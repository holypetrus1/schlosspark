<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Schlosspark – Content-Datei</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f0e5;color:#283126;margin:0;display:grid;place-items:center;min-height:100vh}
    main{max-width:620px;margin:24px;padding:32px;background:#fffaf1;border:1px solid #ddd2bf;border-radius:24px;box-shadow:0 16px 40px rgba(36,77,53,.12)}
    h1{font-family:Georgia,serif;color:#244d35;margin-top:0}
    button{border:0;border-radius:999px;padding:14px 20px;background:#244d35;color:white;font-weight:800;font-size:16px;cursor:pointer}
    p{line-height:1.5}.small{font-size:13px;color:#6a7167}
  </style>
</head>
<body>
<main>
  <h1>Content-Datei herunterladen</h1>
  <p>Hier kannst du immer die aktuell veröffentlichte <strong>content.js</strong> herunterladen.</p>
  <button id="download">content.js herunterladen</button>
  <p id="status" class="small">Der Download wird automatisch gestartet.</p>
</main>
<script>
async function downloadContent() {
  const status = document.getElementById('status');
  try {
    const response = await fetch('../content.js?ts=' + Date.now(), {cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const text = await response.text();
    const blob = new Blob([text], {type:'text/javascript;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'content.js';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    status.textContent = 'Aktuelle content.js wurde bereitgestellt.';
  } catch (err) {
    status.textContent = 'Automatischer Download nicht möglich. Bitte den Button erneut anklicken.';
  }
}
document.getElementById('download').addEventListener('click', downloadContent);
window.addEventListener('load', () => setTimeout(downloadContent, 250));
</script>
</body>
</html>
